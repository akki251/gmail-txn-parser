name: Parser Regression CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  parser-regression:
    name: Parser Regression Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run parser regression suite
        run: npm run test:ci
        env:
          VERBOSE: "1"

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-output
          path: |
            tests/fixtures/corpus.json
          retention-days: 7
