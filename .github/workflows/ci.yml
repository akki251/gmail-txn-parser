name: CI

on:
  push:
    branches: [main, gmail-only, gmail-sms-shortcut]
  pull_request:
    branches: [main, gmail-only, gmail-sms-shortcut]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npm run test:split
      - run: npm run test:sms
      - run: npm run test:nontransactional
      - run: npm run test:stats
      - run: npm run test:matching
      - run: npm run test:dedup
