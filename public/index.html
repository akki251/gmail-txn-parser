<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Txn Splitter</title>

  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Txn Splitter" />
  <meta name="theme-color" content="#0a0e13" />

  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Txn Splitter</h1>
    <button id="refreshBtn" class="refresh-btn" title="Fetch new transactions">⟳</button>
  </header>

  <main id="transactionsView" class="view">
    <div class="hero-card">
      <div class="hero-label">Spent this month</div>
      <div class="hero-amount" id="heroAmount">₹0.00</div>
      <div class="hero-sparkline" id="heroSparkline"></div>
    </div>

    <div class="filter-bar">
      <select id="categoryFilter">
        <option value="">All categories</option>
      </select>
      <div class="pill-group" id="dateFilterPills">
        <button class="pill active" data-value="all">All</button>
        <button class="pill" data-value="today">Today</button>
        <button class="pill" data-value="week">Week</button>
        <button class="pill" data-value="month">Month</button>
      </div>
      <div class="pill-group" id="typeFilterPills">
        <button class="pill active" data-value="">All</button>
        <button class="pill" data-value="debit">Debit</button>
        <button class="pill" data-value="credit">Credit</button>
      </div>
    </div>
    <div id="txnList"></div>
  </main>

  <main id="ledgerView" class="view hidden">
    <div id="ledgerList"></div>
  </main>

  <main id="trendsView" class="view hidden">
    <div class="filter-bar">
      <div class="pill-group" id="trendsPeriodPills">
        <button class="pill" data-value="week">Week</button>
        <button class="pill active" data-value="month">Month</button>
        <button class="pill" data-value="all">All time</button>
      </div>
    </div>
    <div id="statTiles" class="stat-tiles"></div>
    <h4 class="chart-title">Daily spend</h4>
    <div id="trendChart" class="chart-box"></div>
    <h4 class="chart-title">Spend by category</h4>
    <div id="categoryChart" class="chart-box"></div>
  </main>

  <main id="suggestedView" class="view hidden">
    <p class="suggested-intro">Unsplit transactions that look like group expenses — category + amount heuristic, not a trained model.</p>
    <div class="filter-bar">
      <div class="pill-group" id="suggestedSortPills">
        <button class="pill active" data-value="amount">Amount</button>
        <button class="pill" data-value="date">Date</button>
      </div>
    </div>
    <div id="suggestedList"></div>
  </main>

  <main id="detailView" class="view hidden">
    <button id="detailBackBtn" class="back-btn">← Back</button>
    <div id="detailContent"></div>
  </main>

  <nav class="bottom-nav">
    <button class="tab active" data-tab="transactions"><span class="tab-icon">📋</span>Transactions</button>
    <button class="tab" data-tab="suggested"><span class="tab-icon">💡</span>Suggested</button>
    <button class="tab" data-tab="ledger"><span class="tab-icon">🤝</span>Ledger</button>
    <button class="tab" data-tab="trends"><span class="tab-icon">📈</span>Trends</button>
  </nav>

  <div id="categorySheet" class="sheet hidden">
    <div class="sheet-content">
      <h3>Set category</h3>
      <div id="categoryOptions" class="category-options"></div>
      <div class="sheet-actions">
        <button id="categorySheetCancelBtn" class="secondary">Cancel</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <div id="loginScreen" class="login-screen hidden">
    <div class="login-box">
      <h1>Txn Splitter</h1>
      <p>Enter password to continue</p>
      <input id="loginPasswordInput" type="password" placeholder="Password" autocomplete="current-password" />
      <button id="loginSubmitBtn" class="primary">Log in</button>
      <p id="loginError" class="login-error hidden">Incorrect password</p>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
